# -------------------------------------------------------------------------
# This is the default spack repository configuration. It includes the
# builtin spack package repository.
#
# Users can override these settings by editing the following files.
#
# Per-spack-instance settings (overrides defaults):
#   $SPACK_ROOT/etc/spack/repos.yaml
#
# Per-user settings (overrides default and site settings):
#   ~/.spack/repos.yaml
# -------------------------------------------------------------------------
repos:
  # For spack-stack-dev branch of spack repo, keep and update
  # this comment so that we know which version of spack-packages
  # our fork of spack-packages is based on
  #builtin:
  #  git: https://github.com/spack/spack-packages.git
  #  branch: releases/v2025.07
  builtin: ${SPACK_ROOT}/repos/builtin/repos/spack_repo/builtin
  spack_stack: ${SPACK_ROOT}/repos/spack_stack/spack_repo/spack_stack
